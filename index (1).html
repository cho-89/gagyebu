<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="theme-color" content="#d94040">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>가계부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.6.0/dist/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: rgba(0,0,0,0.1);
    --border-med: rgba(0,0,0,0.18);
    --text: #1a1a1a;
    --text-sub: #6b6b6b;
    --text-hint: #aaa;
    --red: #d94040;
    --red-light: #fdf0f0;
    --red-mid: rgba(217,64,64,0.65);
    --purple: #5c4fc9;
    --purple-light: rgba(92,79,201,0.12);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --nav-h: 64px;
  }

  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── layout ── */
  .shell {
    max-width: 430px;
    margin: 0 auto;
    min-height: 100dvh;
    background: var(--bg);
    position: relative;
    padding-bottom: calc(var(--nav-h) + 16px);
  }

  .header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    padding: 14px 20px 10px;
  }
  .header-row { display: flex; align-items: center; justify-content: space-between; }
  .header-title { font-size: 18px; font-weight: 600; color: var(--text); }
  .month-nav { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .month-nav span { flex: 1; text-align: center; font-size: 14px; font-weight: 500; color: var(--text); }
  .nav-btn {
    background: none; border: 0.5px solid var(--border-med);
    border-radius: var(--radius-sm); padding: 5px 10px;
    cursor: pointer; color: var(--text-sub); font-size: 13px; line-height: 1;
    transition: background 0.12s;
  }
  .nav-btn:hover { background: var(--bg); }

  /* ── bottom nav ── */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: var(--surface);
    border-top: 0.5px solid var(--border);
    display: flex;
    z-index: 30;
    height: var(--nav-h);
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px;
    background: none; border: none; cursor: pointer;
    color: var(--text-hint); font-size: 10px; font-weight: 500;
    transition: color 0.15s;
    padding: 8px 0;
  }
  .nav-item i { font-size: 22px; }
  .nav-item.active { color: var(--red); }
  .nav-item.add-btn {
    background: var(--red); color: #fff; border-radius: 0;
    font-size: 11px; font-weight: 600;
  }
  .nav-item.add-btn i { font-size: 24px; }

  /* ── panels ── */
  .panel { display: none; padding: 16px 16px 0; }
  .panel.active { display: block; }

  /* ── cards ── */
  .card {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
  }
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-hint); margin-bottom: 12px;
  }

  /* ── metrics ── */
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .metric {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: var(--radius-md); padding: 14px 16px;
  }
  .metric-label { font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
  .metric-val { font-size: 20px; font-weight: 700; color: var(--text); }
  .metric-val.red { color: var(--red); }

  /* ── list items ── */
  .list-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; border-bottom: 0.5px solid var(--border);
  }
  .list-item:last-child { border-bottom: none; }
  .cat-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--red-light); display: flex; align-items: center;
    justify-content: center; font-size: 16px; flex-shrink: 0;
  }
  .list-info { flex: 1; min-width: 0; }
  .list-name {
    font-size: 14px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .list-sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .list-amt { font-size: 15px; font-weight: 600; color: var(--red); flex-shrink: 0; }
  .del-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-hint); font-size: 14px; padding: 4px;
    flex-shrink: 0; line-height: 1; border-radius: 4px;
    transition: color 0.12s;
  }
  .del-btn:hover { color: var(--red); }
  .empty { text-align: center; padding: 24px; color: var(--text-hint); font-size: 14px; }

  /* ── category bars ── */
  .cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .cat-row:last-child { margin-bottom: 0; }
  .cat-lbl { font-size: 13px; color: var(--text-sub); width: 64px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-bg { flex: 1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; background: var(--red); transition: width 0.4s ease; }
  .bar-fill.purple { background: var(--purple); }
  .cat-sum { font-size: 13px; font-weight: 500; color: var(--text); min-width: 76px; text-align: right; flex-shrink: 0; }

  /* ── add form ── */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-full { grid-column: 1 / -1; }
  .field label { font-size: 12px; color: var(--text-sub); display: block; margin-bottom: 5px; font-weight: 500; }
  .field input, .field select {
    width: 100%; padding: 10px 12px;
    border: 0.5px solid var(--border-med);
    border-radius: var(--radius-sm);
    font-size: 14px; background: var(--bg); color: var(--text); outline: none;
    appearance: none; -webkit-appearance: none;
    transition: border-color 0.12s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--red); box-shadow: 0 0 0 3px rgba(217,64,64,0.1);
  }
  .save-btn {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 600;
    border: none; border-radius: var(--radius-md); cursor: pointer;
    background: var(--red); color: #fff; margin-top: 14px;
    transition: opacity 0.15s;
  }
  .save-btn:hover { opacity: 0.88; }
  .save-btn:active { opacity: 0.75; transform: scale(0.99); }

  /* ── chips ── */
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip {
    padding: 6px 13px; font-size: 12px; font-weight: 500;
    border: 0.5px solid var(--border-med); border-radius: 20px;
    background: var(--surface); color: var(--text-sub); cursor: pointer;
    transition: all 0.12s;
  }
  .chip.on { background: var(--text); color: #fff; border-color: var(--text); }

  /* ── toast ── */
  .toast {
    position: fixed; bottom: calc(var(--nav-h) + 16px); left: 50%;
    transform: translateX(-50%) translateY(8px);
    background: #1a1a1a; color: #fff;
    font-size: 13px; padding: 9px 20px; border-radius: 20px;
    opacity: 0; transition: opacity 0.2s, transform 0.2s;
    pointer-events: none; white-space: nowrap; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── chart wrap ── */
  .chart-wrap { position: relative; width: 100%; height: 180px; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --surface: #1e1e21; --border: rgba(255,255,255,0.1);
      --border-med: rgba(255,255,255,0.18); --text: #f0f0f0; --text-sub: #999;
      --text-hint: #555; --red-light: rgba(217,64,64,0.12);
    }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="header">
    <div class="header-row">
      <span class="header-title">가계부</span>
      <span id="hdr-total" style="font-size:14px;font-weight:600;color:var(--red)"></span>
    </div>
    <div class="month-nav">
      <button class="nav-btn" onclick="shiftMonth(-1)" aria-label="이전 달"><i class="ti ti-chevron-left"></i></button>
      <span id="month-label"></span>
      <button class="nav-btn" onclick="shiftMonth(1)" aria-label="다음 달"><i class="ti ti-chevron-right"></i></button>
    </div>
  </div>

  <!-- 홈 -->
  <div id="p-home" class="panel active">
    <div class="metric-grid">
      <div class="metric"><div class="metric-label">이번 달 지출</div><div class="metric-val red" id="h-total">0원</div></div>
      <div class="metric"><div class="metric-label">건수</div><div class="metric-val" id="h-count">0건</div></div>
    </div>
    <div class="card">
      <div class="section-label">카테고리별</div>
      <div id="h-cat-bars"></div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <span class="section-label" style="margin:0">최근 내역</span>
        <button onclick="goTab('add')" style="font-size:12px;color:var(--text-sub);background:none;border:0.5px solid var(--border-med);border-radius:var(--radius-sm);padding:4px 10px;cursor:pointer"><i class="ti ti-plus"></i> 입력</button>
      </div>
      <div id="h-recent"></div>
    </div>
  </div>

  <!-- 추가 -->
  <div id="p-add" class="panel">
    <div class="card">
      <div class="form-grid">
        <div class="field"><label>날짜</label><input type="date" id="in-date"></div>
        <div class="field"><label>금액 (원)</label><input type="number" id="in-amt" placeholder="0" min="1" inputmode="numeric"></div>
        <div class="field"><label>카테고리</label><select id="in-cat">
          <option>배달</option><option>외식</option><option>식료품</option><option>생필품</option>
          <option>의류</option><option>잡화</option><option>미용실</option><option>경조사비</option>
          <option>보험료</option><option>세금</option><option>통신비</option><option>관리비</option>
          <option>주유비</option><option>주차비</option><option>대중교통비</option>
          <option>병원비</option><option>약국</option><option>용돈</option><option>회비</option>
        </select></div>
        <div class="field"><label>결제 수단</label><select id="in-card">
          <option>신한카드</option><option>토스카드</option><option>롯데카드</option>
          <option>농협카드</option><option>삼성카드</option><option>현금</option>
        </select></div>
        <div class="field form-full"><label>메모 (선택)</label><input type="text" id="in-memo" placeholder="예: 마켓컬리 장보기"></div>
      </div>
      <button class="save-btn" onclick="addEntry()">저장하기</button>
    </div>
  </div>

  <!-- 내역 -->
  <div id="p-list" class="panel">
    <div class="chip-row" id="chip-row"></div>
    <div class="card"><div id="full-list"></div></div>
  </div>

  <!-- 통계 -->
  <div id="p-stats" class="panel">
    <div class="card">
      <div class="section-label">카테고리별 지출</div>
      <div id="s-cat-bars"></div>
    </div>
    <div class="card">
      <div class="section-label">월별 지출 추이</div>
      <div class="chart-wrap">
        <canvas id="barChart" role="img" aria-label="월별 지출 합계 막대 차트">월별 지출 데이터</canvas>
      </div>
    </div>
    <div class="card">
      <div class="section-label">카드별 지출</div>
      <div id="s-card-bars"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-home" onclick="goTab('home')">
      <i class="ti ti-home"></i><span>홈</span>
    </button>
    <button class="nav-item add-btn" id="nav-add" onclick="goTab('add')">
      <i class="ti ti-plus"></i><span>추가</span>
    </button>
    <button class="nav-item" id="nav-list" onclick="goTab('list')">
      <i class="ti ti-list"></i><span>내역</span>
    </button>
    <button class="nav-item" id="nav-stats" onclick="goTab('stats')">
      <i class="ti ti-chart-bar"></i><span>통계</span>
    </button>
  </nav>
</div>

<div id="toast" class="toast">✓ 저장되었습니다</div>

<script>
const CATS = ['배달','외식','식료품','생필품','의류','잡화','미용실','경조사비','보험료','세금','통신비','관리비','주유비','주차비','대중교통비','병원비','약국','용돈','회비'];
const ICON = {배달:'🛵',외식:'🍽️',식료품:'🛒',생필품:'🧴',의류:'👗',잡화:'🛍️',미용실:'✂️',경조사비:'💐',보험료:'🛡️',세금:'📋',통신비:'📱',관리비:'🏠',주유비:'⛽',주차비:'🅿️',대중교통비:'🚌',병원비:'🏥',약국:'💊',용돈:'💸',회비:'🤝'};

let data = [];
try { data = JSON.parse(localStorage.getItem('hj_exp3') || '[]'); } catch(e) {}

let vm = new Date(); vm.setDate(1);
let listFilter = '전체';
let barInst = null;

function save() { try { localStorage.setItem('hj_exp3', JSON.stringify(data)); } catch(e) {} }
function won(n) { return Number(n).toLocaleString('ko-KR') + '원'; }
function mk(d) { const dt = new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`; }
function curMk() { return `${vm.getFullYear()}-${String(vm.getMonth()+1).padStart(2,'0')}`; }
function fmtDate(s) { const d = new Date(s); return `${d.getMonth()+1}/${d.getDate()}`; }
function monthLabel() { return `${vm.getFullYear()}년 ${vm.getMonth()+1}월`; }

function goTab(id) {
  ['home','add','list','stats'].forEach(t => {
    document.getElementById('p-'+t).classList.toggle('active', t === id);
    const nb = document.getElementById('nav-'+t);
    if (nb) nb.classList.toggle('active', t === id);
  });
  if (id === 'home') renderHome();
  if (id === 'list') renderList();
  if (id === 'stats') renderStats();
}

function shiftMonth(d) {
  vm.setMonth(vm.getMonth() + d);
  document.getElementById('month-label').textContent = monthLabel();
  renderHome(); renderStats();
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function addEntry() {
  const date = document.getElementById('in-date').value;
  const amt = parseInt(document.getElementById('in-amt').value);
  if (!date || !amt || amt < 1) {
    document.getElementById('in-amt').focus(); return;
  }
  data.unshift({
    id: Date.now(), date, amt,
    cat: document.getElementById('in-cat').value,
    card: document.getElementById('in-card').value,
    memo: document.getElementById('in-memo').value.trim()
  });
  save();
  document.getElementById('in-amt').value = '';
  document.getElementById('in-memo').value = '';
  showToast();
  renderHome();
}

function delEntry(id) {
  if (!confirm('이 내역을 삭제할까요?')) return;
  data = data.filter(e => e.id !== id);
  save(); renderHome(); renderList(); renderStats();
}

function renderItems(list, el) {
  if (!list.length) { el.innerHTML = '<div class="empty">내역이 없어요</div>'; return; }
  el.innerHTML = list.map(e => `
    <div class="list-item">
      <div class="cat-icon">${ICON[e.cat] || '📝'}</div>
      <div class="list-info">
        <div class="list-name">${e.cat}${e.memo ? ' · ' + e.memo : ''}</div>
        <div class="list-sub">${fmtDate(e.date)} · ${e.card}</div>
      </div>
      <div class="list-amt">−${won(e.amt)}</div>
      <button class="del-btn" onclick="delEntry(${e.id})" aria-label="삭제"><i class="ti ti-x"></i></button>
    </div>`).join('');
}

function renderCatBars(list, el, cls='') {
  const totals = {};
  list.forEach(e => totals[e.cat] = (totals[e.cat] || 0) + e.amt);
  const sorted = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  if (!sorted.length) { el.innerHTML = '<div class="empty" style="padding:8px">내역이 없어요</div>'; return; }
  const max = sorted[0][1];
  el.innerHTML = sorted.map(([cat, sum]) => `
    <div class="cat-row">
      <span class="cat-lbl">${ICON[cat] || '📝'} ${cat}</span>
      <div class="bar-bg"><div class="bar-fill ${cls}" style="width:${Math.round(sum/max*100)}%"></div></div>
      <span class="cat-sum">${won(sum)}</span>
    </div>`).join('');
}

function renderHome() {
  document.getElementById('month-label').textContent = monthLabel();
  const month = data.filter(e => mk(e.date) === curMk());
  const total = month.reduce((s, e) => s + e.amt, 0);
  document.getElementById('h-total').textContent = won(total);
  document.getElementById('h-count').textContent = month.length + '건';
  document.getElementById('hdr-total').textContent = total ? won(total) : '';
  renderCatBars(month, document.getElementById('h-cat-bars'));
  renderItems(month.slice(0, 8), document.getElementById('h-recent'));
}

function renderList() {
  const filters = ['전체', ...CATS];
  document.getElementById('chip-row').innerHTML = filters.map(f =>
    `<button class="chip${f === listFilter ? ' on' : ''}" onclick="setListFilter('${f}')">${f}</button>`
  ).join('');
  const list = listFilter === '전체' ? data : data.filter(e => e.cat === listFilter);
  renderItems(list, document.getElementById('full-list'));
}

function setListFilter(f) { listFilter = f; renderList(); }

function renderStats() {
  const month = data.filter(e => mk(e.date) === curMk());
  renderCatBars(month, document.getElementById('s-cat-bars'));

  const cardTotals = {};
  month.forEach(e => cardTotals[e.card] = (cardTotals[e.card] || 0) + e.amt);
  const cardSorted = Object.entries(cardTotals).sort((a, b) => b[1] - a[1]);
  const cardMax = cardSorted[0] ? cardSorted[0][1] : 1;
  const cardEl = document.getElementById('s-card-bars');
  if (!cardSorted.length) {
    cardEl.innerHTML = '<div class="empty" style="padding:8px">내역이 없어요</div>';
  } else {
    cardEl.innerHTML = cardSorted.map(([card, sum]) => `
      <div class="cat-row">
        <span class="cat-lbl" style="width:72px"><i class="ti ti-credit-card" style="font-size:13px;margin-right:2px"></i>${card.replace('카드','')}</span>
        <div class="bar-bg"><div class="bar-fill purple" style="width:${Math.round(sum/cardMax*100)}%"></div></div>
        <span class="cat-sum">${won(sum)}</span>
      </div>`).join('');
  }

  renderBarChart();
}

function renderBarChart() {
  const months = {};
  data.forEach(e => { const m = mk(e.date); months[m] = (months[m] || 0) + e.amt; });
  const keys = Object.keys(months).sort().slice(-6);
  const labels = keys.map(k => { const [,m] = k.split('-'); return m + '월'; });
  const vals = keys.map(k => months[k]);
  const ctx = document.getElementById('barChart').getContext('2d');
  const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const tickColor = isDark ? '#888' : '#999';
  const gridColor = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.07)';
  if (barInst) barInst.destroy();
  barInst = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: '지출', data: vals,
        backgroundColor: 'rgba(217,64,64,0.65)',
        borderColor: '#d94040', borderWidth: 1, borderRadius: 5
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { font: { size: 12 }, color: tickColor, autoSkip: false, maxRotation: 0 }, grid: { display: false } },
        y: { ticks: { font: { size: 11 }, color: tickColor, callback: v => v >= 10000 ? (v/10000).toFixed(0)+'만' : v }, grid: { color: gridColor } }
      }
    }
  });
}

// 초기화
document.getElementById('in-date').value = new Date().toISOString().split('T')[0];
document.getElementById('month-label').textContent = monthLabel();
renderHome();

// 서비스워커 등록
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
